# XcodeGen spec equivalent to the committed Pip.xcodeproj.
# The committed project opens directly in Xcode 16+. Use this only to regenerate it
# (for example on Xcode 15, which cannot read objectVersion 77):
#   brew install xcodegen && cd ios/Pip && xcodegen generate
# XcodeGen emits explicit file references instead of a synchronized folder, and it
# rewrites Support/Info.plist and PipWidgets/Info.plist from `info.properties` below (same keys).
name: Pip
options:
  bundleIdPrefix: com.pivothacks
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # App bundle id. PipWidgets uses "$(PIP_BUNDLE_ID).PipWidgets", so change it here (not per target).
    PIP_BUNDLE_ID: com.pivothacks.pip
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      MTL_ENABLE_DEBUG_INFO: NO
targets:
  Pip:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pip
    dependencies:
      # Builds the widget extension first and embeds PipWidgets.appex (Live Activity UI).
      - target: PipWidgets
        embed: true
    info:
      path: Support/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Pip talks to your laptop's Pip API over the local network."
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(PIP_BUNDLE_ID)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pip listens while you hold the talk button so it can plan your day."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Pip turns what you say into text on your iPhone so it can plan your day."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Pip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme: {}
  PipWidgets:
    # WidgetKit extension that renders the focus-session Live Activity.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PipWidgets
    info:
      path: PipWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(PIP_BUNDLE_ID).PipWidgets"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PipWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pip
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
